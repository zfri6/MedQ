# V0.3 authoritative amendment: business/input/audio all pix25MHz; board ports unchanged.
# QSTATE rooms A[31:0], B[63:32]; room fields ticketBCD[7:0], ordinary[12:8], return[17:13], state[19:18], calls[21:20], return_current[22], reject[23].
# QSTATE[64]=run; [65]=inputs_ready. Room state 0 idle,1 wait,2 visit.
# room request valid/ticket/return stays until grant or cancellation; first grant pops once, repeats never pop.
# audio cancel identifies active room+ticket; busy stays until PCM safe drain; pause holds progress.

v03_interfaces:
  authority: doc/spec/behavior_spec.md
  clocks: {business: clk_pix_25000000, control: clk_sys_50000000, memory: clk_mem_50000000, sdram_phase_ns: 8, serializer: clk_ser_125000000}
  reset: {business: rst_n_pix_async_assert_sync_release, control: rst_n_sys, memory: rst_n_mem}
  unchanged_board_ports: baseline/v02_frozen/doc/arch/interface_contract.yaml
  medq_v03_inputs:
    domain: clk_pix
    parameters: {DEBOUNCE_CYCLES: 250000, INIT_CYCLES: 250000}
    inputs: {clk: 1, rst_n: 1, keys_sync: 4, switches_sync: 4}
    outputs: {running: 2, ready: 1, enqueue: 4, doctor_event: 2}
    protocol: synchronous_one_cycle_events_after_two_flop_board_synchronizers
    resume: SW1_A_SW2_B_independent_active_low_call_gates_SW3_A_SW4_B_both_edge_doctors_inputs_always_live
  medq_room_service:
    domain: clk_pix
    parameters: {AW: 4, MAX_TICKET: 99, INTERVAL_CYCLES: 750000000}
    inputs: {clk: 1, rst_n: 1, running: 1, ev_normal: 1, ev_return: 1, doctor_event: 1, grant: 1}
    outputs: {request: 1, request_ticket: 8, request_return: 1, state: 2, ticket: 8, current_return: 1, calls: 2, normal_count: AW_plus_1, return_count: AW_plus_1, rejected: 1, accepted: 8, completed: 8, missed: 8, subtitle: 16}
    ordering: reset_then_doctor_then_call_enabled_timeout_grant_elapsed_enqueues_always_live
    queue_updates: independent_simultaneous_enqueues_and_pop_with_net_count_change
    candidate_protocol: live_proposal_rechecked_until_grant_not_an_immutable_valid_ready_message
    first_candidate: may_change_from_ordinary_to_return_before_grant_active_patient_never_changes_on_new_enqueue
    transaction_key: room_plus_return_class_plus_unique_class_BCD_ticket
  medq_dual_service:
    domain: clk_pix
    inputs: {clk: 1, rst_n: 1, running: 2, inputs_ready: 1, enqueue: 4, doctor_event: 2, grant: 2}
    outputs: {request: 2, request_ticket: 16, request_return: 2, qstate: 128}
    ownership: two_independent_room_service_instances
    qstate_room_a: {ticket_bcd: '7:0', normal_count: '12:8', return_count: '17:13', state: '19:18', calls: '21:20', current_return: 22, rejected: 23, reserved_zero: '31:24'}
    qstate_room_b: same_fields_offset_32
    qstate_global: {any_running: 64, inputs_ready: 65, A_running: 66, B_running: 67, A_subtitle: '83:68', B_subtitle: '99:84', reserved_zero: '127:100'}
    states: {IDLE: 0, WAIT_ARRIVAL: 1, IN_VISIT: 2}
  medq_dual_announcer:
    domain: clk_pix
    parameters: {TONE_CYCLES: 3750000}
    inputs: {clk: 1, rst_n: 1, running: 2, voice_ready: 1, request: 2, doctor_event: 2, request_ticket: 16, request_return: 2, qstate: 128, clip_base: 22, clip_samples: 22, play_busy: 1, play_done: 1}
    outputs: {grant: 2, announcement_start: 2, clip_sel: 5, play_req: 1, play_base: 22, play_samples: 22, pcm_abort: 1, fallback_tone: 1, announcing: 1, active_room: 1, active_ticket: 8}
    admission: round_robin_among_enabled_requests_and_valid_replays_no_grant_for_replay
    count_time: first_PCM_request_accepted_or_fallback_admitted_not_request_wait_time
    cancellation: matching_room_return_class_ticket_or_room_stopped_safe_drain_then_replay_same_patient_on_resume
    clips: [please_1, A_2_or_B_17, digit_tens_3_plus_BCD, digit_units_3_plus_BCD, number_to_13, room_A_14_or_B_15, visit_18]
  medq_subtitle_notify:
    domain: clk_pix
    inputs: {clk: 1, rst_n: 1, state_in: 128, announcement_start: 2, grant: 2}
    outputs: {state_out: 128}
    protocol: latest_room_operation_with_combinational_forwarding_and_persistent_replay_notification
    event_descriptors: {A: '83:68', B: '99:84', format: 'epoch15_kind14:11_return10_BCD9:2_reserved1:0'}
    annotated_UI_epochs: {A: 24, B: 56}
    business_fields: unchanged_passthrough
  audio_pcm_player_amendment:
    domains: [clk_pix, clk_mem]
    default_parameter: {CONTROLLED: 0}
    production_parameter: {CONTROLLED: 1}
    added_pix_inputs: {run_enable: 1, abort_play: 1}
    unchanged_ports: baseline/v02_frozen/doc/arch/interface_contract.yaml
    pause: player_retains_legacy_run_enable_semantics_top_aborts_stopped_room_and_restarts_sentence_on_resume
    abort: independent_toggle_CDC_wait_mem_state_idle_ack_then_drain_FIFO_and_7_quiet_pix_cycles_before_busy_clears
    prefill_and_underrun: original_prime_first_then_detect_real_runtime_starvation_semantics_retained
  medq_dual_ui_scene:
    domain: clk_pix
    inputs: {clk: 1, rst_n: 1, x: 10, y: 10, frame_start: 1, qstate: 128, service_status: 8}
    outputs: {font_addr: 14, font_column: 5, background: 24, foreground: 24, text_active: 1, text_opacity: 8}
    snapshot: all_visible_state_and_animation_update_every_frame_independent_of_both_call_gates
    return_prefixes: A_normal_A_B_normal_B_A_return_C_B_return_D
    behavior_amendment: doc/spec/marquee_events_20261101.md
    scroll: independent_positions_one_pixel_per_two_frames_0_to_591_toroidal_window_x24_to_615
    font: one_production_font_rom_ADDR_W13_HEXFILE_font_v03_hex_virtual3584_to11775_subtract3584_mod8192
    latency: existing_one_cycle_font_read_and_two_cycle_OSD_preserved
    visual_amendment: doc/spec/visual_amendment_20261031.md
    font_encoding: 256x256_atlas_2bit_coverage_0_85_170_255_16_pixels_per_word_MSB_left
    scroll_home: per_message_actual_width_centering_per_room_event_phase_reset
  osd_renderer_amendment:
    parameters: {DUAL_default: 0, DUAL_production: 1}
    protocol: existing_ports_and_custom_legacy_OSD_tests_preserved_dual_scene_uses_2bit_coverage_blending_MSB_left
  cdc:
    business_to_sys: cdc_bus_handshake_W128_qstate_pix_to_qstate_sys
    service_to_pix: existing_cdc_bus_handshake_W8
    parameter_to_pix: existing_cdc_bus_handshake_W64
    PCM_to_mem: stable_descriptor_toggle_and_independent_safe_abort_ack
    input: two_flop_pix_board_input_then_debounce_no_clock_gating

